name: Build, Test & Release Replace-GM-Icon

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        run: npm test

  build:
    name: Build Extension Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Extension Package
        run: |
          mkdir -p out
          zip -r "out/Replace GM Icon.ext" extension.xml graphics scripts
          echo "Extension successfully packaged."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Replace-GM-Icon
          path: "out/Replace GM Icon.ext"

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: Replace-GM-Icon
          path: out

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "out/Replace GM Icon.ext" \
            --title "${{ github.ref_name }}" \
            --generate-notes
